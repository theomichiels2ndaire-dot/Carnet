name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk Carnet.apk
      - uses: actions/upload-artifact@v4
        with: { name: Carnet-apk, path: Carnet.apk }
      - name: Publier l'APK sur la branche apk
        run: |
          mkdir out && cp Carnet.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add Carnet.apk && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
